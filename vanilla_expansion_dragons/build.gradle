plugins {
    id 'net.fabricmc.fabric-loom'
    id 'maven-publish'
}

base {
    archivesName = "vanilla_expansion_dragons"
}

sourceSets {
    main {
        java {
            srcDirs = ['src/main/java']
        }
        resources {
            srcDirs = ['src/main/resources', 'src/main/generated']
        }
    }
}

fabricApi {
    configureDataGeneration {
        client = true
    }
}

repositories {
    maven {
        name = "AzureDoom Mods"
        url = "https://maven.azuredoom.com/mods"
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    compileOnly "mod.azure.azurelib:azurelib-common-${project.minecraft_version}:4.1.7"
    implementation "mod.azure.azurelib:azurelib-fabric-${project.minecraft_version}:4.1.7"
    compileOnly "mod.azure.azurelib:azurelib-fabric-${project.minecraft_version}:4.1.7"

    implementation project(":vanilla_expansion_core")
}